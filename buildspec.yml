version: 0.2

phases:

  build:

    commands:

      # ========================================
      # Gradle Build
      # ========================================

      - echo "=== Gradle build start ==="

      - chmod +x gradlew

      - ./gradlew clean build

      - echo "=== Gradle build complete ==="


      # ========================================
      # Lambda Deploy
      # ========================================

      - echo "=== Lambda deploy start ==="

      - aws lambda update-function-url-config --region ap-northeast-1 --function-name basket-schedule-get --cors '{"AllowOrigins":["https://d13o4oynf3jxlu.cloudfront.net"],"AllowMethods":["GET","PUT","DELETE"],"AllowHeaders":["authorization","content-type"],"MaxAge":86400}'

      - aws lambda update-function-url-config --region ap-northeast-1 --function-name FacilityApi --cors '{"AllowOrigins":["https://d13o4oynf3jxlu.cloudfront.net"],"AllowMethods":["GET"],"AllowHeaders":["authorization"],"MaxAge":86400}'

      - aws lambda update-function-url-config --region ap-northeast-1 --function-name basket-schedule-upload --cors '{"AllowOrigins":["https://d13o4oynf3jxlu.cloudfront.net"],"AllowMethods":["POST"],"AllowHeaders":["authorization","content-type"],"MaxAge":86400}'

      - aws lambda update-function-url-config --region ap-northeast-1 --function-name ScheduleRegisterApi --cors '{"AllowOrigins":["https://d13o4oynf3jxlu.cloudfront.net"],"AllowMethods":["POST"],"AllowHeaders":["authorization","content-type"],"MaxAge":86400}'

      - aws lambda update-function-code --region ap-northeast-1 --function-name basket-schedule-image-processor --zip-file fileb://build/libs/basket-schedule-app-lambda-1.0.0.jar

      - aws lambda update-function-code --region ap-northeast-1 --function-name FacilityApi --zip-file fileb://build/libs/basket-schedule-app-lambda-1.0.0.jar

      - aws lambda update-function-code --region ap-northeast-1 --function-name basket-schedule-upload --zip-file fileb://build/libs/basket-schedule-app-lambda-1.0.0.jar

      - aws lambda update-function-code --region ap-northeast-1 --function-name basket-schedule-get --zip-file fileb://build/libs/basket-schedule-app-lambda-1.0.0.jar

      - aws lambda update-function-code --region ap-northeast-1 --function-name ScheduleRegisterApi --zip-file fileb://build/libs/basket-schedule-app-lambda-1.0.0.jar

      - echo "=== Lambda deploy complete ==="


      # ========================================
      # Static Website Deploy
      # ========================================

      - echo "=== S3 deploy start ==="

      - aws s3 sync src/main/resources/static/ s3://basket-schedule-web/ --delete

      - echo "=== S3 deploy complete ==="


      # ========================================
      # CloudFront Cache Invalidation
      # ========================================

      - echo "=== CloudFront invalidation start ==="

      - aws cloudfront create-invalidation --distribution-id EMBH1RVLQTXDG --paths "/*"

      - echo "=== CloudFront invalidation complete ==="
