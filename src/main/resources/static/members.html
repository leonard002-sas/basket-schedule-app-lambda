<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#173d31" />
        <title>ユーザー管理 · Flight Penguins Official Site</title>
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <link rel="stylesheet" href="app.css" />
        <link rel="stylesheet" href="theme.css" />
        <link rel="stylesheet" href="members.css" />
        <link rel="stylesheet" href="visual-system.css" />
        <script src="theme.js"></script>
        <script src="frontend-config.js"></script>
    </head>
    <body>
        <div class="app-shell">
            <header class="site-header">
                <a
                    class="brand-lockup"
                    href="index.html"
                    aria-label="Flight Penguins Official Site"
                >
                    <img class="brand-mark" src="favicon.svg" alt="" aria-hidden="true" />
                    <span>
                        <span class="brand-name">FLIGHT PENGUINS</span>
                        <span class="brand-caption">Official Site</span>
                    </span>
                </a>
                <div class="header-actions">
                    <button type="button" class="theme-toggle" data-theme-toggle></button>
                </div>
            </header>
            <nav class="site-navigation" aria-label="メインナビゲーション">
                <a href="index.html" data-app-nav="calendar">予定表</a>
                <a href="register.html?screen=schedule" data-app-nav="schedule">予定登録</a>
                <a href="register.html?screen=facility" data-app-nav="facility">施設登録</a>
                <a href="index.html?screen=announcements" data-app-nav="announcements">周知事項</a>
                <a href="index.html?screen=videos" data-app-nav="videos">練習動画</a>
                <a href="basketball.html?view=teams" data-app-nav="teams">チーム</a>
                <a href="basketball.html?view=games" data-app-nav="games">試合</a>
                <a href="basketball.html?view=rankings" data-app-nav="rankings">ランキング</a>
                <a href="members.html" data-admin-only hidden aria-current="page">ユーザー管理</a>
            </nav>

            <main class="members-page">
                <section class="workspace-screen-heading">
                    <div>
                        <span class="eyebrow">ROOT ADMIN</span>
                        <h1>ユーザー管理</h1>
                        <p>メンバーの利用状態と管理者権限を確認します。</p>
                    </div>
                </section>

                <section
                    id="rootAdminRequired"
                    class="workspace-content-card members-notice"
                    hidden
                >
                    <h2>管理者専用の画面です</h2>
                    <p>
                        ユーザーの管理は、Cognito の admins または root-admins
                        グループに登録された担当者のみ実行できます。
                    </p>
                    <a class="button-light" href="index.html">予定表へ戻る</a>
                </section>

                <section id="userManagementWorkspace" class="workspace-content-card" hidden>
                    <div class="members-toolbar">
                        <div class="members-counts" aria-live="polite">
                            <span><strong id="totalUsers">0</strong> 登録メンバー</span>
                            <span><strong id="adminUsers">0</strong> 管理者</span>
                            <span><strong id="disabledUsers">0</strong> 利用停止</span>
                        </div>
                        <label class="members-search">
                            <span>名前・メールで検索</span>
                            <input
                                id="userSearch"
                                type="search"
                                autocomplete="off"
                                placeholder="例：aki@example.com"
                            />
                        </label>
                    </div>
                    <p
                        id="userManagementStatus"
                        class="members-status"
                        role="status"
                        aria-live="polite"
                    ></p>
                    <div id="userList" class="user-list"></div>
                    <p class="members-footnote">
                        root
                        管理者と自分自身は、この一覧から停止・削除できません。最後に残る有効な管理者も降格・停止・削除できません。
                    </p>
                </section>
            </main>
        </div>
        <script src="account-menu.js"></script>
        <script src="members.js"></script>
    </body>
</html>
