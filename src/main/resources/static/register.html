<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3f6f8">
    <title>予定を登録 · COURTSIDE</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="app.css">
</head>

<body style="display: none;">
    <div id="imageJobBanner" class="image-job-banner" hidden aria-live="polite">
        <div id="imageJobList"></div>
        <button type="button" id="imageJobDismiss" class="image-job-dismiss" hidden>閉じる</button>
    </div>

    <div class="app-shell admin-shell">
        <header class="site-header">
            <a class="brand-lockup" href="index.html" aria-label="バスケットボール予定表へ戻る">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="12.2" stroke="currentColor" stroke-width="1.8"/><path d="M5.3 10.1c7.1 1.8 14.3 1.8 21.4 0M5.3 21.9c7.1-1.8 14.3-1.8 21.4 0M16 3.8c-4.1 3.1-6.2 7.2-6.2 12.2S11.9 25.1 16 28.2M16 3.8c4.1 3.1 6.2 7.2 6.2 12.2S20.1 25.1 16 28.2" stroke="currentColor" stroke-width="1.5"/></svg>
                </span>
                <span><span class="brand-name">COURTSIDE</span><span class="brand-caption">Basketball schedule</span></span>
            </a>
            <button id="backButton" type="button" class="button-light">← カレンダーへ</button>
        </header>

        <section class="admin-page-heading">
            <span class="eyebrow">Admin studio</span>
            <h1>予定を登録</h1>
            <p>フォーム入力または画像解析で、チームの予定を追加できます。</p>
        </section>

        <main class="registration-grid">
            <section class="section" id="facilityRegistrationCard" aria-labelledby="facilityHeading">
                <div class="section-heading">
                    <span class="section-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M4 20V6.5L12 3l8 3.5V20M8 20v-5h8v5M8 9h.01M12 9h.01M16 9h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </span>
                    <div><h2 id="facilityHeading">施設を登録</h2><p>施設を追加すると、予定登録の候補にすぐ反映されます。</p></div>
                </div>
                <form id="facilityRegisterForm" class="facility-register-form">
                    <label>施設名<input id="facilityNameInput" name="facilityName" type="text" maxlength="120" placeholder="例：落合第五小学校" required></label>
                    <label>住所<input id="facilityAddressInput" name="address" type="text" maxlength="300" placeholder="例：東京都新宿区上落合３丁目１−６" required></label>
                    <label>施設URL（任意）<input id="facilityUrlInput" name="url" type="url" maxlength="1000" placeholder="https://example.jp/施設案内"></label>
                    <label class="facility-note-field">備考（任意）<textarea id="facilityNoteInput" name="note" maxlength="1000" rows="3" placeholder="例：正面玄関から入館／室内シューズ必須"></textarea><span class="field-hint">駐車場、入口、持ち物などチーム向けのメモ</span></label>
                    <button id="facilityRegisterButton" type="submit">施設を登録</button>
                </form>
                <div id="facilityStatus" role="status" aria-live="polite"></div>
            </section>

            <section class="section" id="manualRegistrationCard" aria-labelledby="manualHeading">
                <div class="section-heading">
                    <span class="section-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="15" rx="2.5" stroke="currentColor" stroke-width="1.7"/><path d="M8 3.5v3M16 3.5v3M4.5 9h15M8 13h3M8 16.5h7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                    </span>
                    <div><h2 id="manualHeading">手入力で登録</h2><p>日付、時間、施設を入力してください。</p></div>
                </div>

                <div id="scheduleRows">
                    <div class="schedule-row">
                        <select class="event-type-select" aria-label="予定種別">
                            <option value="PRACTICE">練習</option>
                            <option value="GAME">試合</option>
                        </select>
                        <input type="date" class="date-input" aria-label="日付">
                        <input type="time" class="time-input" aria-label="開始時刻">
                        <span>～</span>
                        <input type="time" class="time-input" aria-label="終了時刻">
                        <select class="facility-select" aria-label="施設">
                            <option value="">施設を選択してください</option>
                        </select>
                        <button type="button" class="delete-button">削除</button>
                    </div>
                </div>

                <button type="button" id="addScheduleButton" class="button-light">＋ 予定を追加</button>
                <button type="button" id="registerButton">予定を登録</button>
                <div id="status" role="status" aria-live="polite"></div>
            </section>

            <section class="section" id="imageUploadCard" aria-labelledby="imageHeading">
                <div class="section-heading">
                    <span class="section-icon" aria-hidden="true" style="color:#a8582d;background:#fff1e8;">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M4 16.5 8.2 12l3.1 3.2 3.2-3.7 5.5 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.2" cy="8.2" r="1.7" stroke="currentColor" stroke-width="1.7"/><rect x="3" y="3.5" width="18" height="17" rx="3" stroke="currentColor" stroke-width="1.7"/></svg>
                    </span>
                    <div><h2 id="imageHeading">画像から登録</h2><p>予定表の写真から日程を読み取ります。</p></div>
                </div>

                <label class="upload-dropzone" id="uploadDropzone" for="imageFile">
                    <span class="upload-drop-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5M4.5 14.5v3A2.5 2.5 0 0 0 7 20h10a2.5 2.5 0 0 0 2.5-2.5v-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </span>
                    <strong id="selectedFileName">画像を選択、またはここにドロップ</strong>
                    <span>JPG・PNG・WebPに対応</span>
                    <input type="file" id="imageFile" class="file-input-hidden" accept="image/jpeg,image/png,image/webp">
                </label>

                <button id="uploadButton" type="button">画像をアップロード</button>
                <div id="uploadStatus" role="status" aria-live="polite"></div>
            </section>
        </main>
    </div>

    <script src="image-jobs.js"></script>
    <script src="register.js"></script>
</body>

</html>
